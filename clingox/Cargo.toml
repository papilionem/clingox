[package]
name = "clingox"
version = "508.2.0-beta.1"
description = "Safe, idiomatic Rust bindings to the clingo answer set programming system"
keywords = ["clingo", "asp", "answer-set-programming", "logic", "solver"]
categories = ["api-bindings", "science", "algorithms"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
documentation = "https://docs.rs/clingox"
# The tests are ported from clingo and need the repository (the vendored
# submodule) to run, so the package leaves them out; see
# tests/conformance/README.md.
exclude = ["/tests/"]

[lints]
workspace = true

[dependencies]
clingox-derive = { path = "../clingox-derive", version = "=508.2.0-beta.1", optional = true }
clingox-sys = { path = "../clingox-sys", version = "=508.2.0-beta.1", default-features = false }
log = { version = "0.4.34", optional = true }

[features]
default = ["log", "derive", "vendored", "threads"]
# Builds clingo from the source vendored in clingox-sys, with its patches.
# Without it, a system clingo is used (see the guide's installation chapter).
vendored = ["clingox-sys/vendored"]
# Builds clasp with threads: asynchronous solving, timeouts and more than one
# solver thread. On WebAssembly it takes effect only with the `atomics`
# target feature.
threads = ["clingox-sys/threads"]
# Forwards every message clingo logs to the `log` crate, target `clingox`.
log = ["dep:log"]
# `#[derive(ToSymbol)]`, `#[derive(FromSymbol)]` and `sym!`. The traits, the
# typed readers, `add_facts` and `testing` work without it.
derive = ["dep:clingox-derive"]

[dev-dependencies]
trybuild = "1.0.121"

[target."cfg(unix)".dev-dependencies]
libc = "0.2.189"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = "0.8.2"

# Not run by `cargo test`; see docs/dev/BENCHMARKS.md.
[[bench]]
name = "layer"
harness = false

# docs.rs builds without a C++ toolchain budget: clingox-sys skips the native build
# when DOCS_RS is set and rustdoc needs only the committed bindings.
[package.metadata.docs.rs]
features = ["derive", "log"]
targets = ["x86_64-unknown-linux-gnu"]
