[package]
name = "clingox-derive"
version = "508.2.0-beta.5"
description = "Procedural macros for clingox: derive ToSymbol and FromSymbol, and sym!"
keywords = ["clingo", "answer-set", "asp", "derive"]
categories = ["development-tools::procedural-macro-helpers"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/clingox-derive"
# What the package ships, and nothing else (checked by `cargo xtask check`
# against xtask/package-lists). The README comes from `readme`.
include = [
    "/Cargo.toml",
    "/src/**/*.rs",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
heck = "0.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.6"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
