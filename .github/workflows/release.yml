# Releases from a version tag (docs/dev/RELEASING.md).
#
# Pushing a tag vX.Y.Z runs, in order:
#
#   verify          the tag is a version in our scheme and names the vendored clingo;
#                   every crate has that version and the requirements between them
#                   ask for it; the tagged commit is on main; CHANGELOG.md has a
#                   section for it (kept as the release notes); the public API passes
#                   `cargo xtask semver` against the previous release tag.
#   ci, docs-rs     the full CI matrix (ci.yml) and the docs.rs build (docs-rs.yml) on
#                   the tagged commit, called as reusable workflows: any failed job
#                   stops the release.
#   package         `cargo package` of the three crates, which builds each from its
#                   packaged sources, before anything is published.
#   publish         clingox-sys, clingox-derive and clingox to crates.io, in that
#                   order, in the `release` environment (which can require a
#                   reviewer). A crate already on crates.io at this version is
#                   skipped, so a failed run can be re-run.
#   github-release  the published .crate files, checked against the crates.io index,
#                   with SHA256SUMS and build provenance attestations, attached to a
#                   GitHub Release whose notes are the changelog section.
#
# Run by hand (Actions, Release, Run workflow) it is a rehearsal by default: `tag`
# names the release to rehearse, on the commit of the branch or tag the run is
# started from, and everything up to `package` runs; nothing is published. A run with
# `dry_run` off publishes, and only when started from the tag itself.
#
# Why a reusable call of ci.yml and not `workflow_run`: the release then carries its
# own CI result for the exact tagged commit, including the jobs a push to main leaves
# out (ci.yml runs them for release tags), and does not depend on another workflow's
# run that may be missing or re-run.
#
# No job here restores or saves a cache (Swatinem/rust-cache, ccache): what is
# packaged and published is built from a clean checkout. The CI matrix keeps its
# caches; they only speed up tests, and a tag never writes them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, like v508.2.0-beta.2
        type: string
        required: true
      dry_run:
        description: Rehearse only; publish nothing
        type: boolean
        default: true

permissions: {}

# One run per tag or branch at a time; a second waits instead of cancelling the first,
# which may be publishing. Called, ci.yml takes the group `Release-<ref>`; group names
# ignore case, so this one must differ from it by more than case.
concurrency:
  group: release-run-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify
    # Only the public repository releases: a v* tag in any other copy of this
    # repository (a fork, a mirror) never gets past here, even with Actions on.
    if: github.repository == 'papilionem/clingox'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      dry_run: ${{ steps.tag.outputs.dry_run }}
      version: ${{ steps.tree.outputs.version }}
      prerelease: ${{ steps.tree.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch and tag: origin/main for the ancestry check, the earlier
          # release tags for the API check.
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: The tag and the commit
        id: tag
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          # The input is free text: its full form is checked by verify.sh below, but
          # it reaches outputs and messages first.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]]; then
            echo "::error::The tag must look like v508.2.0 or v508.2.0-beta.2."
            exit 1
          fi
          dry_run=false
          [ "$DRY_RUN" = true ] && dry_run=true
          # A real release runs only from the tag itself, so what is published is
          # exactly what the tag names.
          if [ "$dry_run" = false ] && [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::A release runs from its tag: start the run from $TAG, or rehearse with dry_run."
            exit 1
          fi
          # A rehearsal may come before the tag; once it exists, it must name this commit.
          if target=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG is $target, but this run is for $GITHUB_SHA."
              exit 1
            fi
          elif [ "$dry_run" = false ]; then
            echo "::error::The tag $TAG does not exist."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; only commits on main are released."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
      # Before verify.sh, which reads the workspace with `cargo metadata`.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (v1)
        with:
          toolchain: stable
      - name: Versions, requirements, changelog
        id: tree
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/release/verify.sh "$TAG" --notes "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-semver-checks
      # Against the previous release explicitly: `cargo xtask semver` alone takes the
      # newest tag, which is this release's own tag once it exists.
      - name: The API check against the previous release
        env:
          PREVIOUS: ${{ steps.tree.outputs.previous }}
        run: |
          if [ -z "$PREVIOUS" ]; then
            echo "::notice::No earlier release tag; the API check has no baseline."
          else
            cargo xtask semver --baseline-rev "$PREVIOUS"
          fi
      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tree.outputs.prerelease }}
          DRY_RUN: ${{ steps.tag.outputs.dry_run }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            echo "::notice::$TAG is a pre-release: Cargo selects it only when a requirement names a pre-release."
          fi
          if [ "$DRY_RUN" = true ]; then
            echo "::notice::Rehearsal of $TAG: nothing is published."
          fi

  ci:
    name: ci
    needs: verify
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] a called workflow is read from the caller's commit, not from files on the runner; actionlint does not accept `$/` yet
    permissions:
      contents: read

  docs-rs:
    name: docs.rs
    needs: verify
    uses: ./.github/workflows/docs-rs.yml # zizmor: ignore[self-repository] as for ci.yml above
    permissions:
      contents: read

  package:
    name: package
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (v1)
        with:
          toolchain: stable
      # Packs the three crates and builds each from its package, clingox against the
      # packages of the other two, as `cargo publish` will.
      - run: cargo package --locked -p clingox-sys -p clingox-derive -p clingox
      - name: Checksums
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir dist
          for crate in clingox-sys clingox-derive clingox; do
            cp "target/package/$crate-$VERSION.crate" dist/
          done
          (cd dist && sha256sum -- *.crate > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: [verify, ci, docs-rs, package]
    if: github.repository == 'papilionem/clingox' && needs.verify.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write # the OIDC token that trusted publishing exchanges
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      HAS_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      USER_AGENT: clingox-release (https://github.com/${{ github.repository }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (v1)
        with:
          toolchain: stable
      # crates.io trusted publishing: the job's OIDC identity is exchanged for a
      # short-lived token, revoked when the job ends. A crate's first publish cannot
      # use it, so a CARGO_REGISTRY_TOKEN secret, when one exists, is used instead
      # (RELEASING.md).
      - name: Trusted publishing token
        id: auth
        if: env.HAS_REGISTRY_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          # The sparse index file of a crate (names of four or more characters),
          # one JSON line per version.
          index_url() { echo "https://index.crates.io/${1:0:2}/${1:2:2}/$1"; }
          # 0 when the version is in the index, 1 when it is not (a crate that does
          # not exist yet is a 404), 2 when the index cannot be read.
          published() {
            local status found
            status=$(curl -sS -o "$RUNNER_TEMP/index" -w '%{http_code}' \
              -A "$USER_AGENT" -H 'Cache-Control: no-cache' "$(index_url "$1")") || return 2
            case $status in
              200)
                found=$(jq -s --arg v "$VERSION" 'any(.[]; .vers == $v)' "$RUNNER_TEMP/index") || return 2
                [ "$found" = true ] ;;
              404) return 1 ;;
              *) echo "the index answered $status for $1" >&2; return 2 ;;
            esac
          }
          for crate in clingox-sys clingox-derive clingox; do
            state=0
            published "$crate" || state=$?
            if [ "$state" = 0 ]; then
              echo "::notice::$crate $VERSION is on crates.io already; skipped."
              continue
            fi
            [ "$state" = 1 ] || exit 1
            cargo publish --locked -p "$crate"
            # The next crate resolves this one from the index, so wait until it is
            # there (cargo publish waits as well, but for a shorter time).
            for attempt in $(seq 1 60); do
              state=0
              published "$crate" || state=$?
              [ "$state" = 0 ] && break
              if [ "$attempt" = 60 ]; then
                echo "::error::$crate $VERSION is not in the index after 10 minutes."
                exit 1
              fi
              sleep 10
            done
            echo "$crate $VERSION published."
          done

  github-release:
    name: GitHub Release
    needs: [verify, publish]
    if: github.repository == 'papilionem/clingox' && needs.verify.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # creates the GitHub Release and uploads its files
      id-token: write # the Sigstore certificate of the attestations
      attestations: write # stores the attestations
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      USER_AGENT: clingox-release (https://github.com/${{ github.repository }})
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes
      # The files crates.io serves, each checked against the checksum the index
      # records for it: what is attested and attached is exactly what Cargo downloads.
      - name: The published .crate files
        run: |
          mkdir dist
          for crate in clingox-sys clingox-derive clingox; do
            file="dist/$crate-$VERSION.crate"
            curl -fsSL -A "$USER_AGENT" -o "$file" \
              "https://static.crates.io/crates/$crate/$crate-$VERSION.crate"
            want=$(curl -fsSL -A "$USER_AGENT" "https://index.crates.io/${crate:0:2}/${crate:2:2}/$crate" \
              | jq -r --arg v "$VERSION" 'select(.vers == $v) | .cksum')
            have=$(sha256sum "$file" | cut -d' ' -f1)
            if [ -z "$want" ] || [ "$want" != "$have" ]; then
              echo "::error::$file has sha256 $have, the index records '${want:-nothing}'."
              exit 1
            fi
          done
          (cd dist && sha256sum -- *.crate > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.crate
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=()
          [ "$PRERELEASE" = true ] && flag=(--prerelease)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A re-run: the release exists, so only its files are replaced.
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${flag[@]}" \
              --title "clingox $VERSION" --notes-file notes/notes.md dist/*
          fi
