# Releases, through a release pull request as the human gate (docs/dev/RELEASING.md).
#
# Our version number encodes the clingo version (508.2.x is clingo 5.8.2), so the
# maintainer chooses it and no tool derives it from an API check: a bump chosen by
# tooling would break the encoding.
#
#   prepare  started by hand with the version: sets the version of the crates and of
#            the requirements between them, renames the changelog's Unreleased
#            section, runs the API check (`cargo xtask semver`, which fails on a
#            breaking change) and opens the pull request `Release vX.Y.Z` from the
#            branch `release-plz-X.Y.Z`. Nothing is published.
#   release  when the CI workflow has finished on a push to main: release-plz
#            publishes clingox-sys, clingox-derive and clingox in that order, tags
#            vX.Y.Z, and this job creates the GitHub Release. release-plz.toml sets
#            `release_always = false`, so it publishes only when the commit is the
#            merge of a pull request from a `release-plz-*` branch, and then exactly
#            the version committed in the manifests. On any other commit it does
#            nothing.
#
# Why `workflow_run` and not a reusable call of ci.yml: CI already runs on the same
# push, so calling it from here would run the whole matrix twice. `workflow_run`
# waits for that run, and the job then checks the CI `conclusion` job of the commit
# itself, so a renamed or removed `conclusion` job stops releases instead of waving
# them through.
#
# Publishing authenticates with crates.io trusted publishing (OIDC). A crate's very
# first publish cannot: crates.io offers trusted publishing only for existing crates.
# For that, put a normal token in the CARGO_REGISTRY_TOKEN secret; it is used only
# when it exists (RELEASING.md).
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, like 508.2.0-beta.2 or 508.2.1
        type: string
        required: true
      allow_breaking:
        description: Allow API changes since the last release (only for a pre-release version)
        type: boolean
        default: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: release pull request
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-prepare
      cancel-in-progress: false
    env:
      VERSION: ${{ inputs.version }}
      ALLOW_BREAKING: ${{ inputs.allow_breaking }}
      # The API check reads rustdoc JSON, which never needs the native build.
      DOCS_RS: "1"
      # A pull request opened with GITHUB_TOKEN does not start CI. A token of a
      # GitHub App or a personal access token in this secret does.
      PR_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ env.PR_TOKEN }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (v1)
        with:
          toolchain: stable
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-semver-checks
      - name: Set the version and the changelog section
        run: scripts/release/prepare.sh "$VERSION"
      - name: The API check
        run: |
          # A pre-release may break the API when the maintainer says so; 508.2.x
          # never may. With no earlier release tag there is nothing to compare with.
          if [ "$ALLOW_BREAKING" = true ] && [[ "$VERSION" == *-* ]]; then
            echo "API changes allowed for the pre-release $VERSION."
          else
            cargo xtask semver
          fi
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ env.PR_TOKEN }}
        run: |
          branch="release-plz-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -a -m "Release: version $VERSION"
          git push origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Release v$VERSION" \
            --body "Sets the version to $VERSION and names the changelog section. Merge to publish once CI is green (docs/dev/RELEASING.md)."

  release:
    name: publish
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # An environment named `release` can require a reviewer; trusted publishing on
    # crates.io can be limited to it too (RELEASING.md).
    environment: release
    permissions:
      contents: write
      pull-requests: read
      checks: read
      id-token: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      HAS_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      # The commit CI ran for: a later push to main must not change what is released.
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: CI succeeded for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The workflow's own conclusion is not enough: require the aggregate job
          # by name, and fail when it is missing (an empty set must not pass).
          results=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "conclusion") | .conclusion')
          if [ -z "$results" ] || [ "$(printf '%s\n' "$results" | sort -u)" != "success" ]; then
            echo "The CI job 'conclusion' of $SHA has result '${results:-missing}'; not releasing." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (v1)
        with:
          toolchain: stable
      - name: Trusted publishing token
        id: auth
        if: env.HAS_REGISTRY_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        id: plz
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
      - name: GitHub Release
        if: steps.plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ steps.plz.outputs.releases }}
        run: |
          # One tag for the three crates, on clingox; the notes are the changelog
          # section, not commit messages.
          echo "$RELEASES" | jq -r '.[] | select(.package_name == "clingox") | "\(.tag) \(.version)"' |
          while read -r tag version; do
            scripts/release/changelog.sh section "$version" > "$RUNNER_TEMP/notes.md"
            flag=()
            [[ "$version" == *-* ]] && flag=(--prerelease)
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag "${flag[@]}" \
              --title "clingox $version" --notes-file "$RUNNER_TEMP/notes.md"
          done
